<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaris2 CS User Guide</title>
<meta name="description" content="Avaris2 CS user guide: urban drainage and collection system modeling with 1D-2D flood simulation, GIS, themes, flags and reports.">
<style>
:root {
  --bg: #ffffff; --bg2: #f5f7fa; --bg3: #eef2f7; --ink: #1d2733; --ink2: #44505e; --muted: #6b7684;
  --line: #dde3ea; --accent: #0b63c4; --accent2: #e6f0fb; --accent-ink: #084a93;
  --note: #e8f2fd; --note-b: #3f8ad8; --tip: #e9f7ef; --tip-b: #2e9b5f; --warn: #fff6e5; --warn-b: #d88a1a; --lic: #f3eefc; --lic-b: #7b55c7;
  --code: #f2f4f7; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --top: 56px; --nav: 290px;
}
:root[data-theme="dark"] { --bg:#11161c; --bg2:#161d25; --bg3:#1c2530; --ink:#e3e8ee; --ink2:#c2cbd6; --muted:#8d99a6; --line:#2a3542; --accent:#5aa2ef; --accent2:#18304b; --accent-ink:#8cc0f7;
  --note:#132a42; --tip:#123222; --warn:#33270f; --lic:#251c3a; --code:#1c2530; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#11161c; --bg2:#161d25; --bg3:#1c2530; --ink:#e3e8ee; --ink2:#c2cbd6; --muted:#8d99a6; --line:#2a3542; --accent:#5aa2ef; --accent2:#18304b; --accent-ink:#8cc0f7;
  --note:#132a42; --tip:#123222; --warn:#33270f; --lic:#251c3a; --code:#1c2530; } }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
/* top bar */
.top { position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 7px; background: linear-gradient(135deg, #1565c0, #42a5f5); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.brand small { font-weight: 400; color: var(--muted); }
.top .sp { flex: 1; }
.search { position: relative; width: min(360px, 40vw); }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px 0 34px; background: var(--bg2); color: var(--ink); font: inherit; font-size: 14px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--bg); }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; color: var(--muted); }
.results { position: absolute; top: 42px; left: 0; right: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; display: none; }
.results a { display: block; padding: 8px 12px; color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; }
.results a:hover, .results a.on { background: var(--accent2); text-decoration: none; }
.results a small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 860px) { .results { position: fixed; top: calc(var(--top) - 4px); left: 12px; right: 12px; } }
.iconbtn { border: 1px solid var(--line); background: var(--bg); color: var(--ink2); border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font: inherit; font-size: 14px; }
.iconbtn:hover { background: var(--bg2); }
#menuBtn { display: none; }
/* layout */
.layout { display: grid; grid-template-columns: var(--nav) minmax(0, 1fr) 220px; padding-top: var(--top); min-height: 100vh; }
nav.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; border-right: 1px solid var(--line); background: var(--bg2); padding: 14px 0 40px; font-size: 14.5px; }
nav.side .ch { margin: 2px 0; }
nav.side .chh { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; padding: 7px 16px; cursor: pointer; text-align: left; }
nav.side .chh:hover { background: var(--bg3); }
nav.side .chh .tw { width: 12px; color: var(--muted); transition: transform .15s; display: inline-block; }
nav.side .ch.open .tw { transform: rotate(90deg); }
nav.side ul { list-style: none; margin: 0; padding: 0 0 4px; display: none; }
nav.side .ch.open ul { display: block; }
nav.side li a { display: block; padding: 5px 16px 5px 36px; color: var(--ink2); border-left: 3px solid transparent; }
nav.side li a:hover { background: var(--bg3); text-decoration: none; }
nav.side li a.on { color: var(--accent-ink); background: var(--accent2); border-left-color: var(--accent); font-weight: 600; }
main { min-width: 0; padding: 26px 48px 80px; }
article { max-width: 880px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
h1 { font-size: 32px; line-height: 1.25; margin: 0 0 14px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 23px; margin: 34px 0 10px; padding-top: 6px; font-weight: 640; }
h3 { font-size: 18px; margin: 24px 0 8px; font-weight: 640; }
p { margin: 0 0 14px; } ul, ol { margin: 0 0 14px; padding-left: 24px; } li { margin: 3px 0; }
.lead { font-size: 18px; color: var(--ink2); }
kbd { font: 12.5px/1 Consolas, "SF Mono", monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 6px; background: var(--bg2); }
code { font: 13.5px Consolas, "SF Mono", monospace; background: var(--code); border-radius: 4px; padding: 1px 5px; }
pre { background: var(--code); border-radius: 8px; padding: 12px 14px; overflow: auto; font-size: 13.5px; line-height: 1.5; }
pre code { background: none; padding: 0; }
.ui { font-weight: 600; }
figure { margin: 18px 0 22px; }
figure img, figure video { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); background: #fff; }
figure img { cursor: zoom-in; }
figure.narrow img { max-width: min(100%, 560px); }
figure.small img { max-width: min(100%, 380px); }
figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.callout { border-left: 4px solid var(--note-b); background: var(--note); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 16px 0; }
.callout b.t { display: block; margin-bottom: 2px; }
.callout.tip { border-color: var(--tip-b); background: var(--tip); }
.callout.warn { border-color: var(--warn-b); background: var(--warn); }
.callout.lic { border-color: var(--lic-b); background: var(--lic); }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--lic-b); background: var(--lic); border-radius: 999px; padding: 2px 10px; margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; margin: 12px 0 20px; font-size: 14.5px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { background: var(--bg2); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.steps { counter-reset: s; list-style: none; padding-left: 0; }
.steps > li { counter-increment: s; position: relative; padding-left: 40px; margin: 10px 0; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13.5px; font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 16px 0 24px; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--bg); color: var(--ink); }
.card:hover { border-color: var(--accent); text-decoration: none; box-shadow: var(--shadow); }
.card b { display: block; color: var(--accent-ink); margin-bottom: 4px; }
.card span { font-size: 14px; color: var(--ink2); }
.related { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.related h2 { font-size: 17px; margin: 0 0 8px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
.pager a { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 14px; }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager a small { display: block; color: var(--muted); font-size: 12px; }
.pager a.next { text-align: right; }
aside.toc { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; padding: 28px 16px 40px 8px; font-size: 13.5px; }
aside.toc b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
aside.toc a { display: block; color: var(--ink2); padding: 3px 0 3px 10px; border-left: 2px solid var(--line); }
aside.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }
section.topic { display: none; } section.topic.on { display: block; }
.updated { font-size: 13px; color: var(--muted); margin-top: 30px; }
.lightbox { position: fixed; inset: 0; background: rgba(10,14,20,.86); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 20px; }
.lightbox.on { display: flex; } .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; background: #fff; }
.backdrop { display: none; }
@media (max-width: 1180px) { .layout { grid-template-columns: var(--nav) minmax(0, 1fr); } aside.toc { display: none; } }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #menuBtn { display: inline-block; }
  nav.side { position: fixed; left: 0; top: var(--top); bottom: 0; width: min(86vw, 320px); z-index: 40; transform: translateX(-102%); transition: transform .2s; height: auto; }
  body.navopen nav.side { transform: none; box-shadow: var(--shadow); }
  body.navopen .backdrop { display: block; position: fixed; inset: var(--top) 0 0 0; background: rgba(0,0,0,.3); z-index: 35; }
  main { padding: 20px 16px 60px; }
  .brand small, .top .theme { display: none; }
  .search { width: auto; flex: 1; }
  h1 { font-size: 26px; }
}
@media print { .top, nav.side, aside.toc, .pager, .backdrop { display: none !important; } .layout { display: block; padding: 0; } section.topic { display: block !important; page-break-after: always; } main { padding: 0; } }
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="Contents">☰</button>
  <a class="brand" href="#home"><span class="logo">A²</span><span>Avaris2 CS <small>User Guide · 2.6</small></span></a>
  <span class="sp"></span>
  <div class="search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Search the guide" autocomplete="off"><div class="results" id="res"></div></div>
  <button class="iconbtn theme" id="themeBtn" title="Light / dark">◐</button>
</header>
<div class="backdrop" id="backdrop"></div>
<div class="layout">
<nav class="side" id="nav" aria-label="Contents"></nav>
<main><article id="doc">
